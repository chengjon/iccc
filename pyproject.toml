[project]
name = "iccc"
version = "0.1.0"
description = "i-Claude Code CLI - Multi-agent orchestration system for AI CLI instances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.18.0",
    "motor>=3.3.2",
    "pymongo>=4.6.0",
    "redis[asyncio]>=5.0.1",
    "litestar>=2.5.0",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.1",
    "click>=8.1.7",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "types-PyYAML>=6.0.12.12",
    "types-redis>=4.6.0.20240106",
    "types-ujson>=5.9.0.0",
]

[project.scripts]
iccc = "iccc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["iccc"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=iccc --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["iccc"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
